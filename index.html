<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿管理</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.min.css">
</head>
<body>

<form class="w-75 mx-auto">
    <p class="mt-3">年月</p>
    <div class="form-row">
        <div class="col">
            <select class="form-control" name="year"></select>
        </div>
        <div class="col">
            <select class="form-control" name="month"></select>
        </div>
    </div>

    <p class="mt-3">費目</p>
    <div>
        <select class="form-control w-100" name="himo"></select>
    </div>

    <p class="mt-3">金額</p>
    <div class="input-group">
        <input class="form-control w-100" name="udetate" required>
        <div class="input-group-append">
            <span class="input-group-text">円</span>
        </div>
    </div>

    <p class="mt-3">メモ</p>
    <div>
        <input class="form-control w-100" name="memo">
    </div>
    <input type="submit" class="mt-4 btn btn-primary" value="送信">
</form>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>

<script>
$(function () {
    const yearSelect = $('select[name="year"]');
    const monthSelect = $('select[name="month"]');
    const himoSelect = $('select[name="himo"]');
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth() + 1;

    // ===== 次月のデフォルトを安全に決定 =====
    let defaultYear = currentYear;
    let defaultMonth = currentMonth + 1;
    if (currentMonth === 12) {
        defaultYear = currentYear + 1;
        defaultMonth = 1;
    }
    // ====================================

    // 年の選択肢生成（今年〜5年後）
    let yearOptions = '';
    for (let i = 0; i < 6; i++) {
        const year = currentYear + i;
        yearOptions += `<option value="${year}">${year}年</option>`;
    }
    yearSelect.html(yearOptions).val(defaultYear);

    // 月の選択肢生成
    let monthOptions = '';
    for (let i = 1; i <= 12; i++) {
        monthOptions += `<option value="${i}">${i}月</option>`;
    }
    monthSelect.html(monthOptions).val(defaultMonth);

    // ============================
    // ここから：費目リストのキャッシュ（メモリ + localStorage）
    // ============================
    const himoCache = {};                 // ページ内キャッシュ
    const CACHE_TTL_MS = 1000 * 60 * 60 * 24; // 24時間

    function cacheKey(year) {
        return `himoList:${year}`;
    }

    function loadFromLocalStorage(year) {
        try {
            const raw = localStorage.getItem(cacheKey(year));
            if (!raw) return null;
            const obj = JSON.parse(raw);
            if (!obj || !obj.savedAt || !obj.data) return null;
            if (Date.now() - obj.savedAt > CACHE_TTL_MS) return null; // 期限切れ
            return obj.data;
        } catch (e) {
            return null;
        }
    }

    function saveToLocalStorage(year, data) {
        try {
            localStorage.setItem(cacheKey(year), JSON.stringify({
                savedAt: Date.now(),
                data: data
            }));
        } catch (e) {
            // 保存できない環境でも落とさない
        }
    }

    function renderHimoOptions(list) {
        // 文字列連結で一括更新（速い）
        let options = (list || []).map(h => `<option value="${h}">${h}</option>`).join('');
        options += `<option value="収入">収入</option>`;
        himoSelect.html(options);
    }

    async function fetchHimoList(selectedYear) {
        const year = String(selectedYear);

        // 1) メモリキャッシュ
        if (himoCache[year]) {
            renderHimoOptions(himoCache[year]);
            return;
        }

        // 2) localStorageキャッシュ
        const stored = loadFromLocalStorage(year);
        if (stored) {
            himoCache[year] = stored;
            renderHimoOptions(stored);
            return;
        }

        // 3) 通信（初回のみ）
        const url = `https://script.google.com/macros/s/AKfycbyoQ3yzUcz0OwvYSF71htOD6pfzZ6pv2JIvH2Z7N8QtGHjuVKiN8fbzfzIG3o_6a7Tq/exec?action=himo&year=${encodeURIComponent(year)}`;

        try {
            const res = await fetch(url, { cache: "force-cache" });
            const data = await res.json();

            himoCache[year] = data;
            saveToLocalStorage(year, data);
            renderHimoOptions(data);
        } catch (err) {
            console.error("費目取得失敗:", err);
        }
    }
    // ============================
    // ここまで：費目リストのキャッシュ
    // ============================

    // 初回の費目取得（デフォルト年で）
    fetchHimoList(defaultYear);

    // 年選択時の費目リスト再取得
    yearSelect.on('change', function () {
        const selectedYear = $(this).val();
        fetchHimoList(selectedYear);
    });

    // LIFF初期化
    const liffId = "2011999655-EHO5Yz1l";
    liff.init({ liffId })
        .then(() => {
            // LIFF 初期化成功
        })
        .catch((err) => {
            console.error("LIFF初期化失敗:", err);
        });

    // フォーム送信処理
    $('form').submit(function () {
        const year = yearSelect.val();
        const month = monthSelect.val();
        const himo = himoSelect.val();
        const udetate = $('input[name="udetate"]').val();
        const memo = $('input[name="memo"]').val();

        // 基本の3行を組み立て
        let msg = `${year}年${month}月\n${himo}\n${udetate}円`;

        // メモがあれば改行して追加、なければそのまま
        if (memo && memo.trim() !== "") {
            msg += `\n${memo}`;
        }

        sendText(msg);
        return false;
    });

    // LINEメッセージ送信
    function sendText(text) {
        liff.sendMessages([{
            type: 'text',
            text: text
        }]).then(() => {
            liff.closeWindow();
        }).catch((error) => {
            alert('送信失敗: ' + error);
        });
    }
});
</script>

</body>
</html>
